<!-- templates/404.html -->
{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block body %}
<div class="container">
    <div class="card" style="text-align: center;">
        <h1 style="font-size: 4em; color: #667eea;">404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist.</p>
        <a href="{{ url_for('index') }}" class="btn" style="margin-top: 20px;">
            <i class="fas fa-home"></i> Go Home
        </a>
    </div>
</div>
{% endblock %}
